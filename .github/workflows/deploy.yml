name: Deploy
on:
  workflow_dispatch: {}
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm install
      - name: Cache Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome-headless-shell
      - name: Build
        run: npm run docs:build
      - name: Copy Recent Posts to Dist
        run: cp docs/recent-posts.json docs/.vitepress/dist/recent-posts.json
      - name: List build output
        run: ls -la docs/.vitepress/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
